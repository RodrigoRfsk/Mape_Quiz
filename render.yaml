services:
  - type: web
    name: mape-quiz
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    preDeployCommand: pnpm db:push
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false
